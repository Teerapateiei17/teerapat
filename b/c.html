<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ธีระภัทร เพียช่อ (ไวท์)</title>

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: #eef5ff;
        }

        .card{
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,.1);
        }

        .card-header{
            background: linear-gradient(90deg,#0d6efd,#3b82f6);
            color: white;
            border-radius:15px 15px 0 0 !important;
        }

        .form-control:focus,
        .form-select:focus{
            border-color:#0d6efd;
            box-shadow:0 0 0 .2rem rgba(13,110,253,.25);
        }

        .btn{
            min-width:120px;
        }

        .section-title{
            color:#0d6efd;
            font-weight:bold;
            margin-bottom:10px;
        }
    </style>
</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card">

                <div class="card-header text-center py-3">
                    <h2>ฟอร์มลงทะเบียน</h2>
                    <p class="mb-0">ธีระภัทร เพียช่อ (ไวท์)</p>
                </div>

                <div class="card-body p-4">

                    <form method="post" action="z.php" enctype="multipart/form-data">

                        <div class="mb-3">
                            <label class="form-label">ชื่อ-สกุล</label>
                            <input type="text" class="form-control" name="fullname" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">อีเมล</label>
                            <input type="email" class="form-control" name="email">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">อายุ</label>
                                <div class="input-group">
                                    <input type="number" class="form-control" name="age" min="18" max="60">
                                    <span class="input-group-text">ปี</span>
                                </div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">วันที่</label>
                                <input type="date" class="form-control" name="date">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">เลือกสี</label>
                            <input type="color" class="form-control form-control-color" name="color">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">ที่อยู่</label>
                            <textarea class="form-control" name="address" rows="4"></textarea>
                        </div>

                        <div class="mb-4">
                            <div class="section-title">อาหารที่ชอบ</div>

                            <div class="row">

                                <div class="col-md-6">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="food[]" value="ข้าวมันไก่" checked>
                                        <label class="form-check-label">ข้าวมันไก่</label>
                                    </div>

                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="food[]" value="ข้าวขาหมู">
                                        <label class="form-check-label">ข้าวขาหมู</label>
                                    </div>

                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="food[]" value="ก๋วยเตี๋ยว" checked>
                                        <label class="form-check-label">ก๋วยเตี๋ยว</label>
                                    </div>
                                </div>

                                <div class="col-md-6">

                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="food[]" value="ไก่ย่างส้มตำ">
                                        <label class="form-check-label">ไก่ย่างส้มตำ</label>
                                    </div>

                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="food[]" value="ลาบหมู">
                                        <label class="form-check-label">ลาบหมู</label>
                                    </div>

                                </div>

                            </div>

                        </div>

                        <div class="mb-3">
                            <label class="form-label">สาขาวิชา</label>

                            <select class="form-select" name="major">
                                <option value="DBIS">DBIS</option>
                                <option value="BC">BC</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">อัปโหลดรูปภาพ</label>
                            <input class="form-control" type="file" name="picture">
                        </div>

                        <hr>

                        <div class="text-center">

                            <button type="submit" class="btn btn-primary">
                                ลงทะเบียน
                            </button>

                            <button type="reset" class="btn btn-secondary">
                                Reset
                            </button>

                            <button type="button" class="btn btn-info text-white"
                                    onclick="window.print();">
                                พิมพ์หน้านี้
                            </button>

                            <button type="button" class="btn btn-warning"
                                    onmouseover="alert('สวัสดี')">
                                Alert
                            </button>

                            <button type="button" class="btn btn-success"
                                    onclick="window.location='https://www.lazada.co.th/';">
                                Lazada
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
