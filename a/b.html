<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ธีระภัทร เพียช่อ (ไวท์) - Digital Business</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        body{
            background-color:#f4f5f7;
            color:#495057;
            font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
        }

        .profile-card{
            background:#fff;
            border-radius:16px;
            box-shadow:0 10px 30px rgba(0,0,0,.05);
            border:1px solid #e9ecef;
            animation:fadeUp .8s ease;
        }

        @keyframes fadeUp{
            from{
                opacity:0;
                transform:translateY(30px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .profile-card:hover{
            transform:translateY(-5px);
            transition:.3s;
            box-shadow:0 20px 40px rgba(0,0,0,.12);
        }

        .badge-hobby{
            background:#6c757d;
            color:#fff;
            font-weight:500;
        }

        /* รูปโปรไฟล์ */
        .profile-img{
            width:150px;
            height:150px;
            object-fit:cover;
            border-radius:50%;
            border:5px solid #6c757d;
            box-shadow:0 8px 20px rgba(0,0,0,.15);
            cursor:pointer;
            transition:transform .3s;
        }

        .profile-img:hover{
            animation:spin 1s linear infinite;
        }

        @keyframes spin{
            from{
                transform:rotate(0deg) scale(1.08);
            }
            to{
                transform:rotate(360deg) scale(1.08);
            }
        }

        /* รูปด้านล่าง */
        .animated-img{
            width:100%;
            height:250px;
            object-fit:cover;
            border-radius:12px;
            box-shadow:0 4px 12px rgba(0,0,0,.08);
            transition:.4s;
        }

        .animated-img:hover{
            transform:scale(1.05) rotate(2deg);
            box-shadow:0 12px 24px rgba(0,0,0,.15);
        }
    </style>
</head>

<body>

<div class="container my-5">

    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-6">

            <div class="profile-card p-4 p-sm-5 mb-4">

                <div class="text-center mb-4">

                    <!-- รูปโปรไฟล์ -->
                    <img src="1.jpg"
                         alt="Profile"
                         class="profile-img mb-3">

                    <h1 class="h3 fw-bold text-dark mb-1">
                        ธีระภัทร เพียช่อ (ไวท์)
                    </h1>

                    <p class="text-muted mb-0">
                        <i class="bi bi-patch-check-fill text-secondary me-1"></i>
                        นิสิตสาขาวิชาธุรกิจดิจิทัล
                    </p>

                </div>

                <hr>

                <div class="mb-4">

                    <div class="d-flex align-items-center mb-3">

                        <div class="p-2 bg-light rounded text-secondary me-3">
                            <i class="bi bi-envelope-fill fs-5"></i>
                        </div>

                        <div>
                            <small class="text-muted d-block">
                                อีเมล
                            </small>

                            <span class="fw-medium">
                                67010918032@msu.ac.th
                            </span>
                        </div>

                    </div>

                    <div class="d-flex align-items-center mb-3">

                        <div class="p-2 bg-light rounded text-secondary me-3">
                            <i class="bi bi-telephone-fill fs-5"></i>
                        </div>

                        <div>
                            <small class="text-muted d-block">
                                เบอร์โทร
                            </small>

                            <span class="fw-medium">
                                0934635211
                            </span>
                        </div>

                    </div>

                    <div class="d-flex align-items-center">

                        <div class="p-2 bg-light rounded text-secondary me-3">
                            <i class="bi bi-building-fill fs-5"></i>
                        </div>

                        <div>
                            <small class="text-muted d-block">
                                การศึกษา
                            </small>

                            <span class="fw-medium">
                                คณะการบัญชีและการจัดการ
                                มหาวิทยาลัยมหาสารคาม
                            </span>
                        </div>

                    </div>

                </div>

                <div>

                    <h6 class="fw-bold mb-3">

                        <i class="bi bi-heart-fill text-danger me-2"></i>

                        สิ่งที่ชอบ (Lifestyle)

                    </h6>

                    <div class="d-flex flex-wrap gap-2">

                        <span class="badge badge-hobby px-3 py-2 rounded-pill">
                            <i class="bi bi-moon-stars me-1"></i>
                            นอน
                        </span>

                        <span class="badge badge-hobby px-3 py-2 rounded-pill">
                            <i class="bi bi-controller me-1"></i>
                            เล่นเกม
                        </span>

                        <span class="badge badge-hobby px-3 py-2 rounded-pill">
                            <i class="bi bi-film me-1"></i>
                            ดูหนัง
                        </span>

                        <span class="badge badge-hobby px-3 py-2 rounded-pill">
                            <i class="bi bi-music-note-beamed me-1"></i>
                            ฟังเพลง
                        </span>

                    </div>

                </div>

            </div>

            <div class="row g-3">

                <div class="col-6">

                    <img
                        src="https://images.unsplash.com/photo-1460925895917-afdab827c52f?w=500&auto=format&fit=crop&q=60"
                        class="animated-img"
                        alt="Digital Business">

                </div>

                <div class="col-6">

                    <img
                        src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=500&auto=format&fit=crop&q=60"
                        class="animated-img"
                        alt="Digital Business">

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
